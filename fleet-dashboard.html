<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>gato-fleet · tigerking</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:         #0d0d0d;
    --surface:    #141414;
    --surface2:   #1a1a1a;
    --surface3:   #222222;
    --border:     #2a2a2a;
    --border2:    #333333;
    --green:      #00ff88;
    --green-dim:  #00994d;
    --green-glow: rgba(0, 255, 136, 0.12);
    --cyan:       #00d4ff;
    --warn:       #ffaa00;
    --hot:        #ff4444;
    --text:       #e8e8e8;
    --text-dim:   #888;
    --text-muted: #555;
    --radius:     8px;
    --radius-sm:  4px;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
    font-size: 13px;
    line-height: 1.5;
    min-height: 100vh;
  }

  /* ── Topbar ─────────────────────────────────────────────── */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 24px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .topbar-left { display: flex; align-items: center; gap: 16px; }

  .node-name {
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 0.05em;
    color: var(--green);
    text-shadow: 0 0 20px var(--green-glow);
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 2px 8px;
    border-radius: 99px;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.04em;
    border: 1px solid;
  }

  .badge-green  { color: var(--green);  border-color: var(--green-dim); background: rgba(0,255,136,0.06); }
  .badge-cyan   { color: var(--cyan);   border-color: #006680;          background: rgba(0,212,255,0.06); }
  .badge-muted  { color: var(--text-dim); border-color: var(--border2); background: transparent; }

  .pulse {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--green);
    box-shadow: 0 0 6px var(--green);
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50%       { opacity: 0.4; transform: scale(0.75); }
  }

  .topbar-right { display: flex; align-items: center; gap: 12px; color: var(--text-dim); font-size: 11px; }

  #uptime-val, #last-update { color: var(--text); }

  /* ── Layout ──────────────────────────────────────────────── */
  .main { padding: 20px 24px; max-width: 1400px; margin: 0 auto; }

  .section-label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 10px;
  }

  .section { margin-bottom: 28px; }

  /* ── GPU Cards ───────────────────────────────────────────── */
  .gpu-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
    gap: 14px;
  }

  .gpu-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px;
    transition: border-color 0.3s;
  }

  .gpu-card:hover { border-color: var(--border2); }

  .gpu-card-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 16px;
  }

  .gpu-name {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    line-height: 1.3;
  }

  .gpu-index {
    font-size: 10px;
    color: var(--text-muted);
    margin-top: 2px;
  }

  .temp-badge {
    font-size: 13px;
    font-weight: 700;
    padding: 3px 9px;
    border-radius: var(--radius-sm);
    border: 1px solid;
    transition: all 0.4s;
  }

  .temp-cool  { color: var(--cyan);  border-color: #006680; background: rgba(0,212,255,0.06); }
  .temp-warm  { color: var(--warn);  border-color: #664400; background: rgba(255,170,0,0.06); }
  .temp-hot   { color: var(--hot);   border-color: #661111; background: rgba(255,68,68,0.06); }

  /* Bar */
  .bar-row { margin-bottom: 12px; }
  .bar-label-row {
    display: flex;
    justify-content: space-between;
    font-size: 11px;
    color: var(--text-dim);
    margin-bottom: 5px;
  }
  .bar-label-row span:last-child { color: var(--text); }

  .bar-track {
    height: 8px;
    background: var(--surface3);
    border-radius: 99px;
    overflow: hidden;
  }

  .bar-fill {
    height: 100%;
    border-radius: 99px;
    transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    position: relative;
  }

  .bar-fill-vram {
    background: linear-gradient(90deg, var(--green-dim), var(--green));
    box-shadow: 0 0 8px rgba(0,255,136,0.3);
  }

  .bar-fill-util {
    background: linear-gradient(90deg, #0066cc, var(--cyan));
    box-shadow: 0 0 8px rgba(0,212,255,0.3);
  }

  .bar-fill-warn {
    background: linear-gradient(90deg, #664400, var(--warn));
    box-shadow: 0 0 8px rgba(255,170,0,0.3);
  }

  .bar-fill-hot {
    background: linear-gradient(90deg, #661111, var(--hot));
    box-shadow: 0 0 8px rgba(255,68,68,0.3);
  }

  /* ── System Row ──────────────────────────────────────────── */
  .sys-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 14px;
  }

  .sys-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
  }

  .sys-card-title {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 10px;
  }

  .stat-big {
    font-size: 26px;
    font-weight: 700;
    color: var(--text);
    line-height: 1;
    margin-bottom: 2px;
  }

  .stat-big .unit { font-size: 13px; color: var(--text-dim); font-weight: 400; }

  .stat-sub { font-size: 11px; color: var(--text-dim); margin-bottom: 10px; }

  /* ── Ollama Section ──────────────────────────────────────── */
  .ollama-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }

  @media (max-width: 700px) { .ollama-grid { grid-template-columns: 1fr; } }

  .model-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
  }

  .model-card-title {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 10px;
  }

  .model-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 7px 10px;
    border-radius: var(--radius-sm);
    background: var(--surface2);
    margin-bottom: 6px;
    border: 1px solid var(--border);
    transition: border-color 0.2s;
  }

  .model-row:last-child { margin-bottom: 0; }
  .model-row:hover { border-color: var(--border2); }

  .model-row.loaded {
    border-color: var(--green-dim);
    background: var(--green-glow);
  }

  .model-name { font-size: 12px; font-weight: 600; color: var(--text); }
  .model-meta { font-size: 11px; color: var(--text-dim); margin-top: 1px; }
  .model-size { font-size: 11px; color: var(--text-dim); text-align: right; }
  .model-size .loaded-tag {
    display: block;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--green);
  }

  /* ── Network / Info Row ──────────────────────────────────── */
  .info-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 14px;
  }

  .info-chip {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 14px;
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  .info-chip-label {
    font-size: 10px;
    color: var(--text-muted);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.09em;
  }

  .info-chip-value {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
  }

  /* ── Error banner ────────────────────────────────────────── */
  .error-banner {
    display: none;
    padding: 10px 16px;
    background: rgba(255,68,68,0.08);
    border: 1px solid rgba(255,68,68,0.3);
    border-radius: var(--radius-sm);
    color: var(--hot);
    font-size: 12px;
    margin-bottom: 20px;
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <span class="node-name">tigerking</span>
    <span class="badge badge-green"><span class="pulse"></span> LIVE</span>
    <span class="badge badge-cyan" id="agent-version">v0.1.0</span>
    <span class="badge badge-muted" id="os-badge">Ubuntu 25.10</span>
  </div>
  <div class="topbar-right">
    <span>uptime <span id="uptime-val">—</span></span>
    <span>·</span>
    <span>updated <span id="last-update">—</span></span>
  </div>
</div>

<div class="main">
  <div class="error-banner" id="error-banner">Connection lost — retrying…</div>

  <!-- GPUs -->
  <div class="section">
    <div class="section-label">GPUs</div>
    <div class="gpu-grid" id="gpu-grid">
      <!-- populated by JS -->
    </div>
  </div>

  <!-- System -->
  <div class="section">
    <div class="section-label">System</div>
    <div class="sys-grid">
      <div class="sys-card">
        <div class="sys-card-title">CPU</div>
        <div class="stat-big" id="cpu-pct">—<span class="unit"> %</span></div>
        <div class="stat-sub" id="cpu-cores">24 cores</div>
        <div class="bar-row">
          <div class="bar-track"><div class="bar-fill bar-fill-util" id="cpu-bar" style="width:0%"></div></div>
        </div>
      </div>
      <div class="sys-card">
        <div class="sys-card-title">RAM</div>
        <div class="stat-big" id="ram-used">—<span class="unit"> GB</span></div>
        <div class="stat-sub" id="ram-sub">of 123 GB</div>
        <div class="bar-row">
          <div class="bar-track"><div class="bar-fill bar-fill-vram" id="ram-bar" style="width:0%"></div></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Ollama -->
  <div class="section">
    <div class="section-label">Ollama</div>
    <div class="ollama-grid">
      <div class="model-card">
        <div class="model-card-title">Loaded in VRAM</div>
        <div id="loaded-models"><div style="color:var(--text-muted);font-size:12px">No models loaded</div></div>
      </div>
      <div class="model-card">
        <div class="model-card-title">Available</div>
        <div id="available-models"></div>
      </div>
    </div>
  </div>

  <!-- Network / Info -->
  <div class="section">
    <div class="section-label">Node Info</div>
    <div class="info-grid">
      <div class="info-chip">
        <span class="info-chip-label">Tailscale IP</span>
        <span class="info-chip-value" id="ts-ip">100.101.85.119</span>
      </div>
      <div class="info-chip">
        <span class="info-chip-label">LAN IP</span>
        <span class="info-chip-value" id="lan-ip">192.168.5.98</span>
      </div>
      <div class="info-chip">
        <span class="info-chip-label">Arch</span>
        <span class="info-chip-value" id="arch-val">x86_64</span>
      </div>
      <div class="info-chip">
        <span class="info-chip-label">CPU Cores</span>
        <span class="info-chip-value" id="cpu-count-val">24</span>
      </div>
      <div class="info-chip">
        <span class="info-chip-label">Total RAM</span>
        <span class="info-chip-value" id="total-ram-val">123 GB</span>
      </div>
      <div class="info-chip">
        <span class="info-chip-label">Ollama</span>
        <span class="info-chip-value" id="ollama-status">—</span>
      </div>
    </div>
  </div>
</div>

<script>
  const BASE = 'http://localhost:8501';
  let startedAt = null;
  let hardwareLoaded = false;

  function fmt_mb(mb) {
    if (mb >= 1024) return (mb / 1024).toFixed(1) + ' GB';
    return mb + ' MB';
  }

  function fmt_uptime(secs) {
    const d = Math.floor(secs / 86400);
    const h = Math.floor((secs % 86400) / 3600);
    const m = Math.floor((secs % 3600) / 60);
    const s = Math.floor(secs % 60);
    if (d > 0) return `${d}d ${h}h ${m}m`;
    if (h > 0) return `${h}h ${m}m ${s}s`;
    return `${m}m ${s}s`;
  }

  function temp_class(t) {
    if (t >= 80) return 'temp-hot';
    if (t >= 65) return 'temp-warm';
    return 'temp-cool';
  }

  function bar_class(pct) {
    if (pct >= 90) return 'bar-fill-hot';
    if (pct >= 70) return 'bar-fill-warn';
    return 'bar-fill-vram';
  }

  function build_gpu_cards(gpus_hw) {
    const grid = document.getElementById('gpu-grid');
    grid.innerHTML = '';
    gpus_hw.forEach(g => {
      const card = document.createElement('div');
      card.className = 'gpu-card';
      card.id = `gpu-card-${g.index}`;
      card.innerHTML = `
        <div class="gpu-card-header">
          <div>
            <div class="gpu-name">${g.name}</div>
            <div class="gpu-index">GPU ${g.index} · ${fmt_mb(g.vram_total_mb)} VRAM · driver ${g.driver_version}</div>
          </div>
          <div class="temp-badge temp-cool" id="gpu-temp-${g.index}">—°C</div>
        </div>
        <div class="bar-row">
          <div class="bar-label-row"><span>VRAM</span><span id="gpu-vram-label-${g.index}">— / ${fmt_mb(g.vram_total_mb)}</span></div>
          <div class="bar-track"><div class="bar-fill bar-fill-vram" id="gpu-vram-bar-${g.index}" style="width:0%"></div></div>
        </div>
        <div class="bar-row">
          <div class="bar-label-row"><span>Utilization</span><span id="gpu-util-label-${g.index}">—%</span></div>
          <div class="bar-track"><div class="bar-fill bar-fill-util" id="gpu-util-bar-${g.index}" style="width:0%"></div></div>
        </div>`;
      grid.appendChild(card);
    });
  }

  function update_gpu_metrics(gpus) {
    gpus.forEach(g => {
      const vram_pct = (g.vram_used_mb / g.vram_total_mb * 100).toFixed(1);
      const util_pct = g.utilization_pct;
      const tb = document.getElementById(`gpu-temp-${g.index}`);
      const vb = document.getElementById(`gpu-vram-bar-${g.index}`);
      const vl = document.getElementById(`gpu-vram-label-${g.index}`);
      const ub = document.getElementById(`gpu-util-bar-${g.index}`);
      const ul = document.getElementById(`gpu-util-label-${g.index}`);
      if (!tb) return;

      tb.textContent = `${g.temperature_c}°C`;
      tb.className = `temp-badge ${temp_class(g.temperature_c)}`;

      vb.style.width = vram_pct + '%';
      vb.className = `bar-fill ${bar_class(parseFloat(vram_pct))}`;
      vl.textContent = `${fmt_mb(g.vram_used_mb)} / ${fmt_mb(g.vram_total_mb)}`;

      ub.style.width = util_pct + '%';
      ul.textContent = util_pct + '%';
    });
  }

  function update_system(sys) {
    const cpu_pct = sys.cpu_pct;
    const ram_used_gb = (sys.ram_used_mb / 1024).toFixed(1);
    const ram_total_gb = (sys.ram_total_mb / 1024).toFixed(0);
    const ram_pct = (sys.ram_used_mb / sys.ram_total_mb * 100).toFixed(1);

    document.getElementById('cpu-pct').innerHTML = `${cpu_pct.toFixed(1)}<span class="unit"> %</span>`;
    document.getElementById('cpu-bar').style.width = cpu_pct + '%';

    document.getElementById('ram-used').innerHTML = `${ram_used_gb}<span class="unit"> GB</span>`;
    document.getElementById('ram-sub').textContent = `of ${ram_total_gb} GB (${ram_pct}% used)`;
    const rb = document.getElementById('ram-bar');
    rb.style.width = ram_pct + '%';
    rb.className = `bar-fill ${bar_class(parseFloat(ram_pct))}`;
  }

  function update_ollama(ollama) {
    const loaded_el = document.getElementById('loaded-models');
    const avail_el = document.getElementById('available-models');

    if (ollama.loaded_models && ollama.loaded_models.length > 0) {
      loaded_el.innerHTML = ollama.loaded_models.map(m => {
        const vram_gb = (m.size_vram / 1024 / 1024 / 1024).toFixed(1);
        return `<div class="model-row loaded">
          <div><div class="model-name">${m.name}</div><div class="model-meta">active in VRAM</div></div>
          <div class="model-size">${vram_gb} GB<span class="loaded-tag">loaded</span></div>
        </div>`;
      }).join('');
    } else {
      loaded_el.innerHTML = '<div style="color:var(--text-muted);font-size:12px;padding:4px 0">No models loaded</div>';
    }

    if (ollama.available_models) {
      const loaded_names = new Set((ollama.loaded_models || []).map(m => m.name));
      avail_el.innerHTML = ollama.available_models.map(m => {
        const size_gb = (m.size / 1024 / 1024 / 1024).toFixed(1);
        const is_loaded = loaded_names.has(m.name);
        return `<div class="model-row${is_loaded ? ' loaded' : ''}">
          <div><div class="model-name">${m.name}</div></div>
          <div class="model-size">${size_gb} GB${is_loaded ? '<span class="loaded-tag">in VRAM</span>' : ''}</div>
        </div>`;
      }).join('');
    }

    document.getElementById('ollama-status').textContent = ollama.reachable
      ? `reachable · ${(ollama.available_models || []).length} models`
      : 'unreachable';
    document.getElementById('ollama-status').style.color = ollama.reachable ? 'var(--green)' : 'var(--hot)';
  }

  function load_static_info(info) {
    const hw = info.hardware;
    const net = info.network;

    document.getElementById('agent-version').textContent = 'v' + hw.agent_version;
    document.getElementById('os-badge').textContent = hw.os_release;
    document.getElementById('ts-ip').textContent = net.tailscale_ip;
    document.getElementById('lan-ip').textContent = net.lan_ip;
    document.getElementById('arch-val').textContent = hw.arch;
    document.getElementById('cpu-count-val').textContent = hw.cpu_count;
    document.getElementById('cpu-cores').textContent = hw.cpu_count + ' cores';
    document.getElementById('total-ram-val').textContent = (hw.ram_total_mb / 1024).toFixed(0) + ' GB';

    startedAt = hw.started_at;
    build_gpu_cards(hw.gpus);
    hardwareLoaded = true;
  }

  async function refresh() {
    const banner = document.getElementById('error-banner');
    try {
      // Always fetch metrics (live data)
      const mres = await fetch(`${BASE}/metrics`);
      const metrics = await mres.json();
      update_gpu_metrics(metrics.gpus);
      update_system(metrics.system);

      // Fetch /info for ollama + hardware init
      const ires = await fetch(`${BASE}/info`);
      const info = await ires.json();
      if (!hardwareLoaded) load_static_info(info);
      update_ollama(info.ollama);

      // Uptime
      const now_s = Date.now() / 1000;
      if (startedAt) {
        document.getElementById('uptime-val').textContent = fmt_uptime(now_s - startedAt);
      }

      // Last update
      const d = new Date();
      document.getElementById('last-update').textContent =
        d.toLocaleTimeString([], {hour: '2-digit', minute: '2-digit', second: '2-digit'});

      banner.style.display = 'none';
    } catch (e) {
      banner.style.display = 'block';
    }
  }

  // Initial load + polling
  refresh();
  setInterval(refresh, 5000);
</script>
</body>
</html>
